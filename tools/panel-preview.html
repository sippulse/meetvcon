<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MeetVcon side panel preview</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: #202124;
    }
    .meet-mock {
      position: relative;
      flex: 1;
      background:
        radial-gradient(circle at 30% 40%, #2a3042 0%, #1a1c20 60%),
        #202124;
    }
    .video-tile {
      position: absolute;
      background: linear-gradient(160deg, #3c4043 0%, #2a2c31 100%);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8eaed;
      font-weight: 500;
    }
    .video-tile.main {
      top: 60px;
      left: 60px;
      right: 60px;
      bottom: 200px;
      font-size: 32px;
    }
    .video-tile.thumb {
      bottom: 60px;
      width: 180px;
      height: 110px;
      font-size: 14px;
    }
    .thumb1 { left: 60px; }
    .thumb2 { left: 260px; }
    .thumb3 { left: 460px; }
    .controls-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(60, 64, 67, 0.8);
      padding: 10px 16px;
      border-radius: 999px;
    }
    .control {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8eaed;
      font-size: 16px;
    }
    /* Chrome's side panel: its own column beside the page, not an overlay. */
    iframe {
      width: 400px;
      height: 100vh;
      border: 0;
      border-left: 1px solid #000;
    }
  </style>
</head>
<body>
  <div class="meet-mock">
    <div class="video-tile main">Jane Doe</div>
    <div class="video-tile thumb thumb1">You</div>
    <div class="video-tile thumb thumb2">Bruno</div>
    <div class="video-tile thumb thumb3">Alice</div>

    <div class="controls-bar">
      <div class="control">M</div>
      <div class="control">V</div>
      <div class="control">CC</div>
      <div class="control">L</div>
    </div>
  </div>

  <!-- The real side panel page. tools/screenshot.js stubs chrome.* and feeds
       it one snapshot, so this is the shipped code, not a mock of it. -->
  <iframe src="../src/sidepanel/sidepanel.html" title="SipPulse Meet Capture side panel"></iframe>
</body>
</html>
