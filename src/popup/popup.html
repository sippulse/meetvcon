<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SipPulse Meet Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">SIPPULSE</p>
          <h1>Meet Capture</h1>
        </div>
        <button id="settings" class="link">Settings</button>
      </header>

      <section class="status-card">
        <span id="dot" class="dot"></span>
        <div>
          <strong id="status">Checking status…</strong>
          <p id="detail"></p>
        </div>
      </section>

      <button id="startAi" class="primary hidden">
        Start SipPulse AI capture
      </button>
      <button id="setup" class="primary hidden">Review and enable capture</button>
      <p id="aiHint" class="hint hidden">
        Records this Meet tab and your microphone. Uses
        <code>pulse-telephony</code> with automatic language detection and
        speaker diarization.
      </p>
      <p id="message" class="message" aria-live="polite"></p>

      <section id="delivery" class="delivery">
        <h2>Delivery</h2>
        <p>CRM vCon storage <span>✓</span></p>
        <p>Transcript email <span id="email">—</span></p>
      </section>

      <section id="outbox" class="outbox hidden">
        <h2>Needs attention</h2>
        <div id="queue"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
